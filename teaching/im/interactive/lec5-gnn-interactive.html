<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第 5 章专题 · 交互附件：线性规划</title>
<style>
  :root { --ink:#1a1a1a; --muted:#666; --line:#e5e7eb; --accent:#9C2B1E; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 18px 60px; font-family:"Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
          color:var(--ink); background:#fafafa; line-height:1.6; }
  header { max-width:1000px; margin:0 auto 22px; border-left:6px solid var(--accent); padding-left:14px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:15px; margin:0; }
  .card { max-width:1000px; margin:0 auto 18px; background:#fff; border:1px solid var(--line);
           border-radius:10px; padding:18px 20px 12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h2 { font-size:19px; margin:0 0 6px; }
  .desc { color:var(--muted); font-size:14px; margin:0 0 12px; }
  .row { display:grid; grid-template-columns:190px 1fr 110px; gap:12px; align-items:center; margin:6px 0; }
  .row label { font-size:15px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .row output { font-variant-numeric:tabular-nums; font-size:15px; text-align:right; }
  .metrics { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 6px; }
  .metric { flex:1 1 150px; background:#f7f7f8; border-radius:8px; padding:10px 12px; }
  .metric span { display:block; font-size:13px; color:var(--muted); }
  .metric b { font-size:22px; font-variant-numeric:tabular-nums; }
  .metric i { font-style:normal; font-size:12px; color:var(--muted); margin-left:4px; }
  footer { max-width:1000px; margin:26px auto 0; color:var(--muted); font-size:13px; }
</style></head>

<script>
function normInv(p){
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425, ph=1-pl; let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>ph){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function phi(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
function binom(n,k,p){let c=1;for(let i=0;i<k;i++){c=c*(n-i)/(i+1);}return c*Math.pow(p,k)*Math.pow(1-p,n-k);}
</script>

<header><h1>第 5 章专题 · 交互附件：线性规划</h1><p class="sub">影子价格 · 可行域顶点</p></header>
<section class="card">
  <h2>两资源 LP：改 b 看最优解</h2>
  <p class="desc">max 3x1+5x2，s.t. 2x1+4x2≤b1、3x1+2x2≤b2；枚举顶点求最优。</p>
  <div class="controls"><div class="row"><label>机加工工时 b1</label>
        <input type="range" id="b1" min="40" max="200" step="5" value="100">
        <output id="b1-v">100h</output></div><div class="row"><label>装配工时 b2</label>
        <input type="range" id="b2" min="40" max="200" step="5" value="90">
        <output id="b2-v">90h</output></div></div>
  <div class="metrics"><div class="metric"><span>x1（齿轮，百件）</span><b id="o-x1">—</b><i></i></div><div class="metric"><span>x2（链轮，百件）</span><b id="o-x2">—</b><i></i></div><div class="metric"><span>最大利润</span><b id="o-z">—</b><i>万元</i></div></div>
  <script>
  (function(){
    const ids=["b1", "b2"], keys=["b1", "b2"], units={"b1": "h", "b2": "h"}, outs=[["x1", "x1", "x1\uff08\u9f7f\u8f6e\uff0c\u767e\u4ef6\uff09", "", 2], ["x2", "x2", "x2\uff08\u94fe\u8f6e\uff0c\u767e\u4ef6\uff09", "", 2], ["z", "z", "\u6700\u5927\u5229\u6da6", "\u4e07\u5143", 2]];
    const calc=function(b1,b2){ const c=[[0,0]]; const pts=[[0,0],[b2/3,0],[0,Math.min(b1/4,b2/2)]]; let x1=(4*b2-2*b1)/8, x2=(3*b1-2*b2)/8; if(x1>=0&&x2>=0) pts.push([x1,x2]); let best=[0,0,0]; for(const [a,b] of pts){const z=3*a+5*b; if(z>best[2]) best=[a,b,z];} return {x1:best[0], x2:best[1], z:best[2]}; };
    function run(){
      const v={};
      ids.forEach((id,i)=>{const el=document.getElementById(id); v[keys[i]]=parseFloat(el.value);
        document.getElementById(id+"-v").textContent=el.value+(units[id]||"");});
      const r=calc(...keys.map(k=>v[k]));
      outs.forEach(o=>{
        const domId=o[0], key=o[1], dig=o[4], el=document.getElementById("o-"+domId);
        const val=r[key];
        if(val===null||val===undefined||(typeof val==="number"&&Number.isNaN(val))) {el.textContent="—";return;}
        el.textContent=(dig<0)? val : (typeof val==="number"? val.toFixed(dig): val);
      });
    }
    ids.forEach(id=>document.getElementById(id).addEventListener("input",run));
    run();
  })();
  </script>
</section>
