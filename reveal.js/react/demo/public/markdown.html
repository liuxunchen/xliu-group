  <style>
  body { font-family: "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { border-bottom: 2px solid #333; padding-bottom: 8px; }
  h2 { margin-top: 1.5em; border-left: 4px solid #d33; padding-left: 8px; }
  table { border-collapse: collapse; width: 100%; table-layout: auto; margin: 10px 0 20px; }

  blockquote ul { margin: 0; padding-left: 22px; }
  blockquote p { margin: 0.3em 0; }
  /* ===== 侧边栏目录（pandoc --toc 生成的 nav#TOC）===== */
  nav#TOC {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100vh;
    overflow-y: auto;
    background: #f7f7f7;
    border-right: 1px solid #ddd;
    padding: 16px 12px 24px;
    font-size: 13px;
    box-sizing: border-box;
    z-index: 100;
  }
  nav#TOC h1#toc-title {
    font-size: 16px;
    font-weight: bold;
    margin: 0 0 8px;
    padding: 0 4px 8px;
    border-bottom: 1px solid #ccc;
  }
  nav#TOC ul {
    list-style: none;
    margin: 0;
    padding-left: 1em;
  }
  nav#TOC > ul { padding-left: 0; }
  nav#TOC a {
    display: block;
    text-decoration: none;
    color: #333;
    padding: 3px 6px;
    border-radius: 3px;
    line-height: 1.4;
  }
  nav#TOC a:hover { background: #e8e8e8; color: #000; }
  /* 正文让出侧边栏空间 */
  body { margin-left: 300px; }
  @media (max-width: 1000px) {
    nav#TOC {
      position: static;
      width: auto;
      height: auto;

<style>
/* 目录折叠（toc-folding） */
nav#TOC li { position: relative; }
.toc-toggle {
  display: inline-block;
  width: 1.1em;
  cursor: pointer;
  color: #888;
  font-size: 0.85em;
  transition: transform 0.15s ease;
  user-select: none;
  vertical-align: middle;
}
.toc-toggle:hover { color: #000; }
.toc-toggle.open { transform: rotate(90deg); }
</style>
<script>
/* 目录折叠：点击 ▸ 展开/收起子项（2026-08-21 加） */
(function () {
  var toc = document.querySelector('nav#TOC');
  if (!toc) return;
  toc.querySelectorAll('li').forEach(function (li) {
    var sub = li.querySelector(':scope > ul');
    if (!sub) return;
    var a = li.querySelector(':scope > a');
    if (!a) return;
    var toggle = document.createElement('span');
    toggle.className = 'toc-toggle';
    toggle.textContent = '▸';
    toggle.title = '展开/折叠';
    a.parentNode.insertBefore(toggle, a);
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var hidden = sub.style.display === 'none';
      sub.style.display = hidden ? '' : 'none';
      toggle.classList.toggle('open', hidden);
    });
  });
})();
</script>
