/* 目录折叠（toc-folding） */
nav#TOC li { position: relative; }
.toc-toggle {
  display: inline-block;
  width: 1.1em;
  cursor: pointer;
  color: #888;
  font-size: 0.85em;
  transition: transform 0.15s ease;
  user-select: none;
  vertical-align: middle;
}
.toc-toggle:hover { color: #000; }
.toc-toggle.open { transform: rotate(90deg); }
</style>
<script>
/* 目录折叠：点击 ▸ 展开/收起子项（2026-08-21 加） */
(function () {
  var toc = document.querySelector('nav#TOC');
  if (!toc) return;
  toc.querySelectorAll('li').forEach(function (li) {
    var sub = li.querySelector(':scope > ul');
    if (!sub) return;
    var a = li.querySelector(':scope > a');
    if (!a) return;
    var toggle = document.createElement('span');
    toggle.className = 'toc-toggle';
    toggle.textContent = '▸';
    toggle.title = '展开/折叠';
    a.parentNode.insertBefore(toggle, a);
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var hidden = sub.style.display === 'none';
      sub.style.display = hidden ? '' : 'none';
      toggle.classList.toggle('open', hidden);
    });
  });
})();
</script>
